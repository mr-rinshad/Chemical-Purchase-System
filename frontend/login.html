<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Chemical Purchase System</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="public/images/favicon.png">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Theme CSS -->
    <link rel="stylesheet" href="public/css/style.css">
    <style>
        .login-art-img {
            width: 100%;
            height: 100%;
            min-height: 220px;
            object-fit: cover;
            border-radius: 14px;
        }
    </style>
</head>

<body class="bg-white">

    <!-- Minimal Horizontal Top Navbar -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom py-3 sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-3" href="index.html">
                <div class="brand-icon">
                    <img src="public/images/logo.png" alt="Chemical System Logo" class="brand-logo-img">
                </div>
                <span class="navbar-brand-text">Chemical System</span>
            </a>

            <div class="d-flex align-items-center gap-2 ms-auto">
                <a href="index.html" class="btn btn-outline-secondary btn-pill">
                    <i class="fa-solid fa-house me-1"></i> Home
                </a>
                <a href="register.html" class="btn btn-primary btn-pill">
                    <i class="fa-solid fa-user-plus me-1"></i> Register
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="py-5 d-flex align-items-center min-vh-100-nav">
        <div class="container max-w-4xl">

            <div class="card p-0 shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="row g-0">

                    <!-- Left AI Graphic Banner (5 Cols) -->
                    <div class="col-lg-5 p-4 card-header-primary d-flex flex-column justify-content-between">
                        <div>
                            <span class="badge bg-white text-dark mb-2 px-3 py-1.5">
                                <i class="fa-solid fa-shield-halved text-success me-1"></i> Encrypted Access
                            </span>
                            <h3 class="fw-bold text-white mb-1">Portal Sign In</h3>
                            <p class="text-white-50 fs-6 mb-0">Enter registered email credentials to access your dashboard.</p>
                        </div>

                        <div class="my-3">
                            <img src="public/images/security_compliance_art.jpg" alt="Security Artwork" class="login-art-img shadow">
                        </div>

                        <div class="text-white-50 fs-6">
                            <i class="fa-solid fa-circle-check text-success me-1"></i> Role-Based Access Control
                        </div>
                    </div>

                    <!-- Right Login Form (7 Cols) -->
                    <div class="col-lg-7 p-4 p-md-5 bg-white">
                        <h3 class="fw-bold mb-1">Welcome Back</h3>
                        <p class="text-muted fs-6 mb-4">Sign in with your email & password</p>

                        <form id="loginForm">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fa-solid fa-envelope"></i>
                                    </span>
                                    <input type="email" id="email" class="form-control" placeholder="name@domain.com" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fa-solid fa-lock"></i>
                                    </span>
                                    <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                                </div>
                            </div>

                            <div id="message"></div>

                            <button class="btn btn-primary w-100 py-2.5 fs-6 shadow mt-3" type="submit">
                                <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In
                            </button>

                            <div class="text-center mt-4 pt-3 border-top">
                                <span class="text-muted fs-6">Don't have an account? </span>
                                <a href="register.html" class="fw-bold text-decoration-none text-primary">
                                    Register <i class="fa-solid fa-arrow-right ms-1"></i>
                                </a>
                            </div>

                        </form>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <!-- Scripts -->
    <script src="public/js/config.js"></script>
    <script src="public/js/common.js"></script>
    <script src="public/js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
