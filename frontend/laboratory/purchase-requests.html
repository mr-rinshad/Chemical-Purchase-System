<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Purchase Requests</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-primary">

    <div class="container-fluid">

        <a
            href="main-dashboard.html"
            class="navbar-brand">

            ← Dashboard

        </a>

        <button
            class="btn btn-light"
            onclick="logout()">

            Logout

        </button>

    </div>

</nav>

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header">

            <h3>

                Purchase Requests

            </h3>

        </div>

        <div class="card-body">

            <div id="message"></div>

            <div class="d-flex justify-content-between align-items-center mb-3">

                <h4>

                    Purchase Requests

                </h4>

                <button
                    id="updateReservationsBtn"
                    class="btn btn-warning">

                    Update Expired Reservations

                </button>

            </div>
            <div class="row mb-3">

    <div class="col-md-7">

        <input
            type="text"
            id="purchaseSearch"
            class="form-control"
            placeholder="Search User, Chemical or Purchase Code">

    </div>

    <div class="col-md-2">

        <button
            class="btn btn-primary w-100"
            onclick="searchPurchaseRequests()">

            Search

        </button>

    </div>

    <div class="col-md-2">

        <button
            class="btn btn-secondary w-100"
            onclick="loadPurchaseRequests()">

            Refresh

        </button>

    </div>

</div>

            <div class="table-responsive">

                <table class="table table-bordered table-striped">

                    <thead class="table-primary">

                        <tr>

                            <th>User</th>

                            <th>Chemical</th>

                            <th>Quantity</th>

                            <th>Authorization</th>

                            <th>Purpose</th>

                            <th>Expiry</th>

                            <th>Purchase Mode</th>

                            <th>Status</th>

                            <th>Purchase Code</th>

                            <th>Request Date</th>

                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="purchaseRequestTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<div
    class="modal fade"
    id="purchaseDetailsModal"
    tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h4 class="modal-title">

                    Purchase Details

                </h4>

                <button
                    class="btn-close"
                    data-bs-dismiss="modal">

                </button>

            </div>

            <div class="modal-body">

                <table class="table table-bordered">

                    <tr>

                        <th>User</th>

                        <td id="modalUser"></td>

                    </tr>

                    <tr>

                        <th>Authorization Code</th>

                        <td id="modalAuthorization"></td>

                    </tr>

                    <tr>

                        <th>Chemical</th>

                        <td id="modalChemical"></td>

                    </tr>

                    <tr>

                        <th>Quantity</th>

                        <td id="modalQuantity"></td>

                    </tr>

                    <tr>

                        <th>Unit Price</th>

                        <td id="modalUnitPrice"></td>

                    </tr>

                    <tr>

                        <th>Total Price</th>

                        <td id="modalTotalPrice"></td>

                    </tr>

                    <tr>

                        <th>Purchase Mode</th>

                        <td id="modalMode"></td>

                    </tr>

                    <tr>

                        <th>Purchase Code</th>

                        <td id="modalPurchaseCode"></td>

                    </tr>

                    <tr>

                        <th>Status</th>

                        <td id="modalStatus"></td>

                    </tr>

                </table>

                <hr>

                <h5>

                    Complete Purchase

                </h5>

                <div class="row">

                    <div class="col-md-8">

                        <input
                            id="modalPurchaseCodeInput"
                            class="form-control"
                            readonly>

                    </div>

                    <div class="col-md-4">

                        <button

                            class="btn btn-success w-100"

                            onclick="completePurchaseFromModal()">

                            Complete Purchase

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../public/js/config.js"></script>
<script src="../public/js/common.js"></script>
<script src="../public/js/laboratory.js"></script>

</body>

</html>
