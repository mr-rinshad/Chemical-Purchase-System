<!DOCTYPE html>
<html>
<head>
    <title>Admin Profile</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body>
<div class="container mt-4">

    <h2 class="mb-4">
        My Profile
    </h2>

    <!-- Profile Card -->
    <div class="card">
        <div class="card-body">
            <form id="profileForm">
                <div class="mb-3">
                    <label class="form-label">
                        Full Name
                    </label>
                    <input
                        type="text"
                        id="adminFullName"
                        class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Email
                    </label>
                    <input
                        type="email"
                        id="adminEmail"
                        class="form-control"
                        readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Phone
                    </label>
                    <input
                        type="text"
                        id="adminPhone"
                        class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Created At
                    </label>
                    <input
                        type="text"
                        id="adminCreatedAt"
                        class="form-control"
                        readonly>
                </div>

                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="updateProfile()">
                    Update Profile
                </button>
            </form>
        </div>
    </div>

    <!-- Change Password Card -->
    <div class="card mt-4">
        <div class="card-header">
            <h5>
                Change Password
            </h5>
        </div>
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label">
                    Current Password
                </label>
                <div class="input-group">
                    <input
                        type="password"
                        id="currentPassword"
                        class="form-control">
                    <button
                        class="btn btn-outline-secondary"
                        type="button"
                        onclick="togglePassword('currentPassword', this)">
                        Show
                    </button>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    New Password
                </label>
                <div class="input-group">
                    <input
                        type="password"
                        id="newPassword"
                        class="form-control">
                    <button
                        class="btn btn-outline-secondary"
                        type="button"
                        onclick="togglePassword('newPassword', this)">
                        Show
                    </button>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Confirm Password
                </label>
                <div class="input-group">
                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-control">
                    <button
                        class="btn btn-outline-secondary"
                        type="button"
                        onclick="togglePassword('confirmPassword', this)">
                        Show
                    </button>
                </div>
            </div>

            <button
                class="btn btn-warning"
                onclick="changePassword()">
                Change Password
            </button>
        </div>
    </div>

    <!-- Super Admin Section -->
    <div
        class="card mt-4"
        id="createAdminCard"
        style="display:none;">

        <div class="card-header">
            <h5>
                Create New Admin
            </h5>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Full Name
                    </label>
                    <input
                        type="text"
                        id="newAdminName"
                        class="form-control">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Email
                    </label>
                    <input
                        type="email"
                        id="newAdminEmail"
                        class="form-control">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Phone
                    </label>
                    <input
                        type="text"
                        id="newAdminPhone"
                        class="form-control">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Password
                    </label>
                    <div class="input-group">
                        <input
                            type="password"
                            id="newAdminPassword"
                            class="form-control">
                        <button
                            class="btn btn-outline-secondary"
                            type="button"
                            onclick="togglePassword('newAdminPassword', this)">
                            Show
                        </button>
                    </div>
                </div>
            </div>

            <button
                class="btn btn-success"
                onclick="createAdmin()">
                Create Admin
            </button>

            <hr class="my-5">

            <h4 class="mb-3">
                Manage Admins
            </h4>

            <div class="row mb-3">
                <div class="col-md-6">
                    <input
                        type="text"
                        id="adminSearch"
                        class="form-control"
                        placeholder="Search by Name, Email or Phone"
                        onkeyup="searchAdmins()">
                </div>

                <div class="col-md-2">
                    <button
                        class="btn btn-secondary w-100"
                        onclick="loadAdmins()">
                        Refresh
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Status</th>
                            <th width="220">
                                Action
                            </th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                    </tbody>
                </table>
            </div>

            <!-- View Admin Modal -->
            <div
                class="modal fade"
                id="viewAdminModal"
                tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">
                                Admin Details
                            </h5>
                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="modal">
                            </button>
                        </div>
                        <div
                            class="modal-body"
                            id="viewAdminBody">
                        </div>
                        <div class="modal-footer">
                            <button
                                class="btn btn-secondary"
                                data-bs-dismiss="modal">
                                Close
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Edit Admin Modal -->
            <div
                class="modal fade"
                id="editAdminModal"
                tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">
                                Edit Admin
                            </h5>
                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="modal">
                            </button>
                        </div>
                        <div class="modal-body">
                            <input
                                type="hidden"
                                id="editAdminId">
                            <div class="mb-3">
                                <label class="form-label">
                                    Full Name
                                </label>
                                <input
                                    type="text"
                                    id="editAdminName"
                                    class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">
                                    Email
                                </label>
                                <input
                                    type="email"
                                    id="editAdminEmail"
                                    class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">
                                    Phone
                                </label>
                                <input
                                    type="text"
                                    id="editAdminPhone"
                                    class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">
                                    Status
                                </label>
                                <select
                                    id="editAdminStatus"
                                    class="form-select">
                                    <option value="Active">
                                        Active
                                    </option>
                                    <option value="Inactive">
                                        Inactive
                                    </option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button
                                class="btn btn-secondary"
                                data-bs-dismiss="modal">
                                Cancel
                            </button>
                            <button
                                class="btn btn-primary"
                                onclick="updateAdmin()">
                                Update
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

</div>

<script src="../public/js/config.js"></script>
<script src="../public/js/common.js"></script>
<script src="../public/js/admin.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
