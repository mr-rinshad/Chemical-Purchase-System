<!DOCTYPE html>

<html>

<head>

    <title>Purchase Reports</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-4">

    <h2 class="mb-4">

        Purchase Reports

    </h2>

    <div class="row mb-3">

        <div class="col-md-4">

            <input

                type="text"

                id="reportSearch"

                class="form-control"

                placeholder="Search Purchase Code, User, Laboratory or Chemical">

        </div>

        <div class="col-md-2">

            <select

                id="reportStatusFilter"

                class="form-select">

                <option value="">All Status</option>

                <option value="Pending">Pending</option>

                <option value="Approved">Approved</option>

                <option value="Completed">Completed</option>

                <option value="Rejected">Rejected</option>

            </select>

        </div>

        <div class="col-md-2">

            <select

                id="reportReservationFilter"

                class="form-select">

                <option value="">All Reservation</option>

                <option value="Reserved">Reserved</option>

                <option value="Released">Released</option>

                <option value="Expired">Expired</option>

            </select>

        </div>

        <div class="col-md-2">

            <button

                class="btn btn-primary w-100"

                onclick="searchReports()">

                Search

            </button>

        </div>

        <div class="col-md-2">

            <button

                class="btn btn-secondary w-100"

                onclick="loadReports()">

                Refresh

            </button>

        </div>

    </div>

    <div class="row mb-3">

        <div class="col-md-2">

            <button

                class="btn btn-success w-100"

                onclick="downloadReportExcel()">

                Download Excel

            </button>

        </div>

    </div>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

            <tr>

                <th>ID</th>

                <th>User</th>

                <th>Laboratory</th>

                <th>Chemical</th>

                <th>Quantity</th>

                <th>Purchase Code</th>

                <th>Status</th>

                <th>Reservation</th>

                <th>Date</th>

                <th width="100">

                    Action

                </th>

            </tr>

        </thead>

        <tbody id="reportTableBody">

        </tbody>

    </table>

</div>

<!-- View Modal -->

<div

    class="modal fade"

    id="reportModal"

    tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5>

                    Purchase Report Details

                </h5>

                <button

                    class="btn-close"

                    data-bs-dismiss="modal">

                </button>

            </div>

            <div

                class="modal-body"

                id="reportDetails">

            </div>

        </div>

    </div>

</div>

<script src="../public/js/config.js"></script>

<script src="../public/js/common.js"></script>

<script src="../public/js/admin.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Excel Library -->

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

</body>

</html>
