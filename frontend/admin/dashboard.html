<!DOCTYPE html>

<html>

<head>

    <title>Admin Dashboard</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>
    <nav class="navbar navbar-dark bg-primary">

    <div class="container-fluid">

        <a href="main-dashboard.html"
           class="navbar-brand">

            ← Dashboard

        </a>

        <button
            class="btn btn-light"
            onclick="logout()">

            Logout

        </button>

    </div>

</nav>


<div class="container mt-4">

    <h2 class="mb-4">
        Admin Dashboard
    </h2>

    <div class="row">

        <div class="col-md-3 mb-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Total Users</h5>
                    <h2 id="total_users">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Total Laboratories</h5>
                    <h2 id="total_laboratories">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Pending Labs</h5>
                    <h2 id="pending_laboratories">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Approved Labs</h5>
                    <h2 id="approved_laboratories">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Pending Authorizations</h5>
                    <h2 id="pending_authorizations">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Approved Authorizations</h5>
                    <h2 id="approved_authorizations">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Total Chemicals</h5>
                    <h2 id="total_chemicals">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Total Purchase Requests</h5>
                    <h2 id="total_purchase_requests">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Completed Purchases</h5>
                    <h2 id="completed_purchases">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Expired Reservations</h5>
                    <h2 id="expired_reservations">0</h2>
                </div>
            </div>
        </div>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- Project JS -->

<script src="../public/js/config.js"></script>

<script src="../public/js/common.js"></script>

<script src="../public/js/admin.js"></script>

</html>
