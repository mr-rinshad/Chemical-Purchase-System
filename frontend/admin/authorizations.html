<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Authorization Requests</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-4">

    <h2 class="mb-4">

        Pending Authorization Requests

    </h2>

    <div class="row mb-3">

        <div class="col-md-5">

            <input

                type="text"

                id="searchAuthorization"

                class="form-control"

                placeholder="Search User or Authorization Code">

        </div>

        <div class="col-md-2">

            <button

                class="btn btn-primary w-100"

                onclick="searchAuthorizations()">

                Search

            </button>

        </div>

        <div class="col-md-2">

            <button

                class="btn btn-secondary w-100"

                onclick="loadPendingAuthorizations()">

                Refresh

            </button>

        </div>

    </div>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

            <tr>

                <th>ID</th>

                <th>User</th>

                <th>Authorization Code</th>

                <th>Proof Document</th>

                <th>Purpose</th>

                <th>Status</th>

                <th width="220">

                    Action

                </th>

            </tr>

        </thead>

        <tbody id="authorizationTableBody">

        </tbody>

    </table>

    <hr class="my-5">

    <h2 class="mb-4">

        Approved Authorization Requests

    </h2>

    <div class="row mb-3">

        <div class="col-md-5">

            <input

                type="text"

                id="approvedSearch"

                class="form-control"

                placeholder="Search User or Authorization Code">

        </div>

        <div class="col-md-2">

            <button

                class="btn btn-primary w-100"

                onclick="searchApprovedAuthorizations()">

                Search

            </button>

        </div>

        <div class="col-md-2">

            <button

                class="btn btn-secondary w-100"

                onclick="loadApprovedAuthorizations()">

                Refresh

            </button>

        </div>

    </div>

    <table class="table table-bordered table-striped">

        <thead class="table-success">

            <tr>

                <th>ID</th>

                <th>User</th>

                <th>Authorization Code</th>

                <th>Purpose</th>

                <th>Issue Date</th>

                <th>Expiry Date</th>

                <th>Status</th>

                <th width="120">

                    Action

                </th>

            </tr>

        </thead>

        <tbody id="approvedAuthorizationTableBody">

        </tbody>

    </table>

</div>

<!-- View Modal -->

<div

    class="modal fade"

    id="authorizationModal"

    tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5>

                    Authorization Details

                </h5>

                <button

                    class="btn-close"

                    data-bs-dismiss="modal">

                </button>

            </div>

            <div

                class="modal-body"

                id="authorizationDetails">

            </div>

        </div>

    </div>

</div>

<!-- Reject Authorization Modal -->

<div

    class="modal fade"

    id="rejectAuthorizationModal"

    tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    Reject Authorization Request

                </h5>

                <button

                    type="button"

                    class="btn-close"

                    data-bs-dismiss="modal">

                </button>

            </div>

            <div class="modal-body">

                <input

                    type="hidden"

                    id="rejectAuthorizationId">

                <label class="form-label">

                    Rejection Reason

                </label>

                <textarea

                    id="rejectReason"

                    class="form-control"

                    rows="4"

                    placeholder="Enter rejection reason">

                </textarea>

            </div>

            <div class="modal-footer">

                <button

                    class="btn btn-secondary"

                    data-bs-dismiss="modal">

                    Cancel

                </button>

                <button

                    class="btn btn-danger"

                    onclick="submitAuthorizationReject()">

                    Reject

                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="../public/js/config.js"></script>

<script src="../public/js/common.js"></script>

<script src="../public/js/admin.js"></script>

</body>

</html>
