<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>License Registration</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>

<body>

<div class="container mt-4">

    <h2 class="mb-4">

        Laboratory License Registration

    </h2>

    <!-- Register License -->

    <div class="card mb-4">

        <div class="card-header">

            Register New License

        </div>

        <div class="card-body">

            <form id="licenseForm">

                <input
                    type="hidden"
                    id="license_id">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            License Number

                        </label>

                        <input

                            type="text"

                            id="license_number"

                            class="form-control"

                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Laboratory Name

                        </label>

                        <input

                            type="text"

                            id="laboratory_name"

                            class="form-control"

                            required>

                    </div>
                    <div class="col-md-6 mb-3">

    <label class="form-label">
        Owner Name
    </label>

    <input
        type="text"
        id="owner_name"
        class="form-control"
        required>

</div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Issued By

                        </label>

                        <input

                            type="text"

                            id="issued_by"

                            class="form-control"

                            value="Sub District Magistrate"

                            required>

                    </div>

                    <div class="col-md-3 mb-3">

                        <label class="form-label">

                            Issue Date

                        </label>

                        <input

                            type="date"

                            id="issue_date"

                            class="form-control"

                            required>

                    </div>

                    <div class="col-md-3 mb-3">

                        <label class="form-label">

                            Expiry Date

                        </label>

                        <input

                            type="date"

                            id="expiry_date"

                            class="form-control"

                            required>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Status

                        </label>

                        <select

                            id="status"

                            class="form-select">

                            <option value="Active">

                                Active

                            </option>

                            <option value="Expired">

                                Expired

                            </option>

                        </select>

                    </div>

                </div>

                <button

                    class="btn btn-primary"

                    type="submit">

                    Register License

                </button>

            </form>

        </div>

    </div>

    <!-- Search -->

    <div class="row mb-3">

        <div class="col-md-5">

            <input
                id="licenseSearch"
                class="form-control"
                placeholder="Search License Number or Laboratory">

        </div>

        <div class="col-md-2">

            <button
                class="btn btn-primary w-100"
                onclick="searchLicenses()">

                Search

            </button>

        </div>

        <div class="col-md-2">

            <button
                class="btn btn-secondary w-100"
                onclick="loadLicenses();
                         document.getElementById('licenseSearch').value=''">

                Refresh

            </button>

        </div>

    </div>

    <!-- Table -->

    <div class="card">

        <div class="card-header">

            Registered Licenses

        </div>

        <div class="card-body">

            <table class="table table-bordered table-striped">

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>License Number</th>

                        <th>Laboratory</th>

                        <th>Issue Date</th>

                        <th>Expiry Date</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="licenseTableBody">

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- View Modal -->

<div

    class="modal fade"

    id="licenseModal"

    tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5>

                    License Details

                </h5>

                <button

                    class="btn-close"

                    data-bs-dismiss="modal">

                </button>

            </div>

            <div

                class="modal-body"

                id="licenseDetails">

            </div>

        </div>

    </div>

</div>

<script src="../public/js/config.js"></script>

<script src="../public/js/common.js"></script>

<script src="../public/js/admin.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
