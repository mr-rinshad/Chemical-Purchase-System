<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Registration | Chemical Purchase System</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Theme CSS -->
    <link rel="stylesheet" href="public/css/style.css">
</head>

<body class="bg-white">

    <!-- Minimal Horizontal Top Navbar -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom py-3 sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-3" href="index.html">
                <div class="brand-icon">
                    <i class="fa-solid fa-vial-circle-check"></i>
                </div>
                <span class="navbar-brand-text">Chemical System</span>
            </a>

            <div class="d-flex align-items-center gap-2 ms-auto">
                <a href="index.html" class="btn btn-outline-secondary btn-pill">
                    <i class="fa-solid fa-house me-1"></i> Home
                </a>
                <a href="login.html" class="btn btn-primary btn-pill">
                    <i class="fa-solid fa-right-to-bracket me-1"></i> Login
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Registration Section -->
    <main class="py-5">
        <div class="container max-w-4xl">

            <!-- Segmented Control Role Switcher Pill -->
            <div class="text-center mb-4">
                <div class="role-tab-container">
                    <button type="button" class="role-tab-btn active" id="userTab" onclick="showUserForm()">
                        <i class="fa-solid fa-user me-1"></i> User / Researcher
                    </button>
                    <button type="button" class="role-tab-btn" id="labTab" onclick="showLabForm()">
                        <i class="fa-solid fa-flask me-1"></i> Certified Laboratory
                    </button>
                </div>
            </div>

            <!-- User Registration Card -->
            <div id="userRegistration">
                <div class="card p-0 shadow-lg border-0 rounded-4 overflow-hidden">
                    <div class="card-header-primary p-4 text-center">
                        <h3 class="display-title text-white mb-1"><i class="fa-solid fa-user-plus me-2"></i> User Account Registration</h3>
                        <p class="text-white-50 fs-6 mb-0">Register as a researcher or authorized chemical buyer</p>
                    </div>
                    <div class="p-4 p-md-5 bg-white">
                        <form id="registerForm">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Full Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                                        <input type="text" id="full_name" class="form-control" placeholder="e.g. John Doe" minlength="3" required>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                                        <input type="email" id="email" class="form-control" placeholder="name@domain.com" required>
                                    </div>
                                </div>

                                <div class="col-md-12">
                                    <label class="form-label fw-semibold">Phone Number</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                                        <input type="tel" id="phone" class="form-control" placeholder="10-digit mobile number (starts with 6-9)" maxlength="10" pattern="[6-9]{1}[0-9]{9}" oninput="this.value=this.value.replace(/[^0-9]/g,'')" required>
                                    </div>
                                </div>

                                <div class="col-md-12">
                                    <label class="form-label fw-semibold">Delivery / Institution Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-location-dot"></i></span>
                                        <textarea id="address" class="form-control" rows="2" placeholder="Full postal delivery address" minlength="5" required></textarea>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                        <input type="password" id="password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Confirm Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-shield-halved"></i></span>
                                        <input type="password" id="confirm_password" class="form-control" placeholder="Repeat password" minlength="6" required>
                                    </div>
                                </div>
                            </div>

                            <div id="message" class="mt-3"></div>

                            <button class="btn btn-primary w-100 py-3 fs-6 shadow mt-4" type="submit">
                                <i class="fa-solid fa-user-check me-2"></i> Register Account
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Laboratory Registration Card -->
            <div id="laboratoryRegistration" style="display:none;">
                <div class="card p-0 shadow-lg border-0 rounded-4 overflow-hidden">
                    <div class="card-header-primary p-4 text-center">
                        <h3 class="display-title text-white mb-1"><i class="fa-solid fa-flask me-2"></i> Laboratory Registration</h3>
                        <p class="text-white-50 fs-6 mb-0">Register a certified chemical supplying laboratory</p>
                    </div>
                    <div class="p-4 p-md-5 bg-white">
                        <form id="labRegisterForm">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Government License ID</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-id-card"></i></span>
                                        <input type="number" class="form-control" id="lab_license_id" placeholder="Registered License Number" min="1" required>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Laboratory Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-flask"></i></span>
                                        <input type="text" class="form-control" id="lab_name" placeholder="e.g. Apex Bio-Labs" minlength="3" required>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Owner Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-user-tie"></i></span>
                                        <input type="text" id="lab_owner_name" class="form-control" placeholder="Director Name" minlength="3" required>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Official Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                                        <input type="email" class="form-control" id="lab_email" placeholder="contact@labdomain.com" required>
                                    </div>
                                </div>

                                <div class="col-md-12">
                                    <label class="form-label fw-semibold">Phone Number</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                                        <input type="tel" class="form-control" id="lab_phone" placeholder="10-digit contact number" maxlength="10" pattern="[6-9]{1}[0-9]{9}" oninput="this.value=this.value.replace(/[^0-9]/g,'')" required>
                                    </div>
                                </div>

                                <div class="col-md-12">
                                    <label class="form-label fw-semibold">Laboratory Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-location-dot"></i></span>
                                        <textarea class="form-control" id="lab_address" rows="2" placeholder="Full laboratory location address" minlength="5" required></textarea>
                                    </div>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">City</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-city"></i></span>
                                        <input type="text" class="form-control" id="lab_city" required>
                                    </div>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">State</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-map"></i></span>
                                        <input type="text" class="form-control" id="lab_state" required>
                                    </div>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Pincode</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-map-pin"></i></span>
                                        <input type="text" class="form-control" id="lab_pincode" placeholder="6-digit pincode" maxlength="6" pattern="[0-9]{6}" oninput="this.value=this.value.replace(/[^0-9]/g,'')" required>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                        <input type="password" class="form-control" id="lab_password" placeholder="At least 6 characters" minlength="6" required>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Confirm Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-shield-halved"></i></span>
                                        <input type="password" class="form-control" id="lab_confirm_password" placeholder="Repeat password" minlength="6" required>
                                    </div>
                                </div>
                            </div>

                            <button class="btn btn-primary w-100 py-3 fs-6 shadow mt-4" type="submit">
                                <i class="fa-solid fa-flask-vial me-2"></i> Register Laboratory Account
                            </button>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Role Switcher Script -->
    <script>
        function showUserForm() {
            document.getElementById('userRegistration').style.display = 'block';
            document.getElementById('laboratoryRegistration').style.display = 'none';
            document.getElementById('userTab').classList.add('active');
            document.getElementById('labTab').classList.remove('active');
        }
        function showLabForm() {
            document.getElementById('userRegistration').style.display = 'none';
            document.getElementById('laboratoryRegistration').style.display = 'block';
            document.getElementById('labTab').classList.add('active');
            document.getElementById('userTab').classList.remove('active');
        }
    </script>

    <!-- Scripts -->
    <script src="public/js/config.js"></script>
    <script src="public/js/common.js"></script>
    <script src="public/js/register.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
