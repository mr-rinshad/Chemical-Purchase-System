<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Registration</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="public/css/style.css">

</head>

<body class="bg-light">

<div class="position-absolute top-0 start-0 m-3">

    <a
        href="index.html"
        class="btn btn-outline-primary">

        Home

    </a>

</div>

<div class="container">

    <div class="row justify-content-center align-items-center vh-100">

        <div class="col-lg-6 col-md-8">

            <!-- Registration Type Buttons -->

            <div class="text-center mb-4">

                <button
                    type="button"
                    class="btn btn-primary"
                    id="userTab"
                    onclick="showUserForm()">

                    User Registration

                </button>

                <button
                    type="button"
                    class="btn btn-secondary"
                    id="labTab"
                    onclick="showLabForm()">

                    Laboratory Registration

                </button>

            </div>

            <!-- User Registration -->

            <div id="userRegistration">

                <div class="card shadow">

                    <div class="card-header text-center">

                        <h3>User Registration</h3>

                    </div>

                    <div class="card-body">

                        <form id="registerForm">

                            <div class="mb-3">

                                <label class="form-label">

                                    Full Name

                                </label>

                                <input
                                    type="text"
                                    id="full_name"
                                    class="form-control"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">

                                    Email

                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">

                                    Phone Number

                                </label>

                                <input
                                    type="tel"
                                    id="phone"
                                    class="form-control"
                                    maxlength="10"
                                    pattern="[6-9]{1}[0-9]{9}"
                                    oninput="this.value=this.value.replace(/[^0-9]/g,'')"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">

                                    Address

                                </label>

                                <textarea
                                    id="address"
                                    class="form-control"
                                    rows="3"
                                    required></textarea>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">

                                    Password

                                </label>

                                <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">

                                    Confirm Password

                                </label>

                                <input
                                    type="password"
                                    id="confirm_password"
                                    class="form-control"
                                    required>

                            </div>

                            <div id="message"></div>

                            <button
                                class="btn btn-success w-100"
                                type="submit">

                                Register

                            </button>

                            <a
                                href="login.html"
                                class="btn btn-secondary w-100 mt-2">

                                Back to Login

                            </a>

                        </form>

                    </div>

                </div>

            </div>

            <!-- Laboratory Registration -->

            <div id="laboratoryRegistration" style="display:none;">

                <div class="card shadow">

                    <div class="card-header bg-primary text-white">

                        <h3 class="text-center">

                            Laboratory Registration

                        </h3>

                    </div>

                    <div class="card-body">

                        <form id="labRegisterForm">

                            <div class="mb-3">

                                <label>License ID</label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="lab_license_id"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label>Laboratory Name</label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="lab_name"
                                    required>

                            </div>
                            <div class="mb-3">
    <label>Owner Name</label>
    <input
        type="text"
        id="lab_owner_name"
        class="form-control"
        required
    >
</div>

                            <div class="mb-3">

                                <label>Email</label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="lab_email"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label>Phone</label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="lab_phone"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label>Address</label>

                                <textarea
                                    class="form-control"
                                    id="lab_address"
                                    required></textarea>

                            </div>

                            <div class="mb-3">

                                <label>City</label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="lab_city"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label>State</label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="lab_state"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label>Pincode</label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="lab_pincode"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label>Password</label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="lab_password"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label>Confirm Password</label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="lab_confirm_password"
                                    required>

                            </div>

                            <button
                                class="btn btn-success w-100"
                                type="submit">

                                Register Laboratory

                            </button>
                              <a
                                href="login.html"
                                class="btn btn-secondary w-100 mt-2">

                                Back to Login

                            </a>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="public/js/config.js"></script>
<script src="public/js/common.js"></script>
<script src="public/js/register.js"></script>

</body>

</html>
